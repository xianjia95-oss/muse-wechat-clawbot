name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Node 24 / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci --no-fund
      - run: npm test
      - run: npm run demo
      - run: npm run soak -- --duration 5s
      - run: python -m unittest discover -s test -p test_public_package.py
      - run: python scripts/build_app_package.py
      - name: Upload source archive
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: muse-link-source
          path: |
            dist/muse-link-v*.zip
            dist/muse-link-v*.zip.sha256
          if-no-files-found: error
  installer:
    name: Linux installer and rollback
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies in disposable Linux container
        run: docker run --rm -v "$PWD:/work" -w /work node:24-bookworm-slim npm ci --no-fund
      - name: Exercise install, failure, backup, upgrade and rollback
        run: docker run --rm -v "$PWD:/work:ro" -w /work node:24-bookworm-slim bash test/install-smoke.sh
